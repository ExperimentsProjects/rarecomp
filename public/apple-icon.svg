<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="180" height="180" role="img" aria-label="Experiments_Projects logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2416"/>
      <stop offset="100%" stop-color="#0d120a"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8ffa8"/>
      <stop offset="100%" stop-color="#b8e34f"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9b2f7"/>
      <stop offset="100%" stop-color="#8f6fe0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="14" width="484" height="484" rx="38" fill="none" stroke="#d1f876" stroke-opacity="0.18" stroke-width="4"/>

  <!-- circuit traces -->
  <g stroke="#d1f876" stroke-opacity="0.22" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M62 120h56v56"/>
    <path d="M450 392h-56v-56"/>
    <path d="M120 62v56h56"/>
    <path d="M392 450v-56h-56"/>
  </g>
  <g fill="#d1f876" fill-opacity="0.5">
    <circle cx="62" cy="120" r="7"/><circle cx="450" cy="392" r="7"/>
    <circle cx="120" cy="62" r="7"/><circle cx="392" cy="450" r="7"/>
  </g>

  <!-- stacked layers (the "experiments" stack) -->
  <g filter="url(#glow)">
    <path d="M256 96 116 164l140 68 140-68-140-68Z" fill="url(#violet)" opacity="0.95"/>
    <path d="M116 216 256 284l140-68" fill="none" stroke="url(#violet)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
    <path d="M116 268 256 336l140-68" fill="none" stroke="#d1f876" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- spark / plug detail -->
  <g fill="#e8ffa8">
    <rect x="330" y="196" width="56" height="16" rx="8" transform="rotate(-14 330 196)"/>
  </g>
  <path d="M212 372l12 26 26 12-26 12-12 26-12-26-26-12 26-12 12-26Z" fill="#d1f876" opacity="0.92"/>
</svg>
